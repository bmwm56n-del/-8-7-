<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استضافة بوتات AFK مجانية</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; margin: 0; }
        .card { background: #1e293b; padding: 25px; border-radius: 15px; max-width: 500px; margin: 20px auto; border: 1px solid #334155; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
        .ad-slot { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; margin-bottom: 20px; min-height: 60px; display: flex; justify-content: center; align-items: center; }
        h1 { color: #fbbf24; font-size: 24px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #475569; background: #334155; color: white; box-sizing: border-box; }
        .btn { background: #fbbf24; color: #000; padding: 15px; border: none; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; font-size: 18px; transition: 0.3s; }
        .btn:hover { background: #f59e0b; }
        #log { background: #000; height: 120px; margin-top: 20px; border-radius: 8px; padding: 10px; overflow-y: auto; text-align: left; color: #10b981; font-family: monospace; font-size: 13px; border: 1px solid #334155; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🤖 استضافة بوت ماين كرافت</h1>

        <div class="ad-slot">
            <script type="text/javascript">
                atOptions = {
                    'key' : 'c581b787edadef8c7336230e7e1d49e8',
                    'format' : 'iframe',
                    'height' : 50,
                    'width' : 320,
                    'params' : {}
                };
            </script>
            <script type="text/javascript" src="https://www.highperformanceformat.com/c581b787edadef8c7336230e7e1d49e8/invoke.js"></script>
        </div>

        <input type="text" id="h" placeholder="آي بي السيرفر (IP)">
        <input type="text" id="u" placeholder="اسم البوت (Username)">
        
        <button class="btn" onclick="start()">▶ تشغيل البوت</button>

        <div id="log">>> جاهز للعمل...</div>
    </div>

    <script>
        const socket = io();
        
        function start() {
            const host = document.getElementById('h').value;
            const user = document.getElementById('u').value;
            
            if(!host || !user) return alert("الرجاء إدخال البيانات!");

            // تشغيل البوت عبر السيرفر
            socket.emit('start-bot', { host, username: user });
            document.getElementById('log').innerHTML += `<div>> جاري الاتصال بـ ${host}...</div>`;
        }

        socket.on('status', m => {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `<div>> ${m}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        });
    </script>

</body>
</html>
